<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>タスク一覧</title>
</head>
<body>

<h1>タスク一覧</h1>

<div style="text-align: right;">
    <a th:href="@{/tasks/create}">新規登録</a>
</div>


<table border="1">
    <tr>
        <th>タスク名</th>
        <th>優先度</th>
        <th>ステータス</th>
        <th>作成年月日</th>
        <th>操作</th>
    </tr>

    <tr th:each="task : ${tasks}">

        <!-- タスク名 -->
        
    <td>
            <a th:href="@{/tasks/{id}(id=${task.id})}"
               th:text="${task.title}"></a>
        </td>


        <!-- 優先度 -->
        <td th:text="${task.priority}"></td>

        <!-- ステータス -->
        <td>
            <form th:action="@{/tasks/{id}/update-status(id=${task.id})}" method="post" style="display:inline;">
                <select name="status" onchange="this.form.submit()">
                    <option value="未着手" th:selected="${task.status == '未着手'}">未着手</option>
                    <option value="進行中" th:selected="${task.status == '進行中'}">進行中</option>
                    <option value="完了" th:selected="${task.status == '完了'}">完了</option>
                </select>
            </form>
        </td>

        <!-- 作成年月日 -->
        <td th:text="${#temporals.format(task.createdAt, 'yyyy-MM-dd')}"></td>

        <!-- 操作 -->
        <td>
            <a th:href="@{/tasks/{id}/edit(id=${task.id})}">編集</a>
            <form th:action="@{/tasks/{id}/delete(id=${task.id})}" method="post" style="display:inline;" onsubmit="return confirm('このタスクを削除してもよろしいですか？');">
                <button type="submit">削除</button>
            </form>
        </td>

    </tr>
</table>

</body>
</html>
